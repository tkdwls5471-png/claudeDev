<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>EML Analyzer — 로그인</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
        .card { animation: fadeUp .35s ease both; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<div class="card w-full max-w-sm">
    <!-- Logo -->
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-600 text-white text-2xl mb-4 shadow-lg shadow-blue-600/30">✉</div>
        <h1 class="text-2xl font-extrabold text-slate-800" style="font-family:Manrope">EML Analyzer</h1>
        <p class="text-sm text-slate-500 mt-1">업체 이메일 요구사항 자동 분석</p>
    </div>

    <!-- Tab -->
    <div class="flex bg-slate-100 rounded-xl p-1 mb-6">
        <button id="tab-login" onclick="switchTab('login')"
            class="flex-1 py-2 text-sm font-semibold rounded-lg bg-white shadow-sm text-blue-700 transition-all">로그인</button>
        <button id="tab-register" onclick="switchTab('register')"
            class="flex-1 py-2 text-sm font-medium text-slate-500 transition-all">회원가입</button>
    </div>

    <!-- Form -->
    <form id="auth-form" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wider">아이디</label>
            <input id="username" type="text" autocomplete="username" placeholder="아이디 입력"
                class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"/>
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wider">비밀번호</label>
            <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호 입력"
                class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"/>
        </div>

        <div id="error-msg" class="hidden text-sm text-red-600 bg-red-50 rounded-xl px-4 py-3"></div>

        <button type="submit" id="submit-btn"
            class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-blue-600/20 mt-2">
            로그인
        </button>
    </form>
</div>

<script>
let mode = 'login';

function switchTab(t) {
    mode = t;
    const isLogin = t === 'login';
    document.getElementById('tab-login').className    = isLogin
        ? 'flex-1 py-2 text-sm font-semibold rounded-lg bg-white shadow-sm text-blue-700 transition-all'
        : 'flex-1 py-2 text-sm font-medium text-slate-500 transition-all';
    document.getElementById('tab-register').className = !isLogin
        ? 'flex-1 py-2 text-sm font-semibold rounded-lg bg-white shadow-sm text-blue-700 transition-all'
        : 'flex-1 py-2 text-sm font-medium text-slate-500 transition-all';
    document.getElementById('submit-btn').textContent = isLogin ? '로그인' : '회원가입';
    hideError();
}

function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.classList.remove('hidden');
}
function hideError() {
    document.getElementById('error-msg').classList.add('hidden');
}

document.getElementById('auth-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    if (!username || !password) { showError('아이디와 비밀번호를 모두 입력하세요'); return; }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = '처리 중...';

    try {
        const endpoint = mode === 'login' ? '/api/auth/login' : '/api/auth/register';
        const res = await fetch(endpoint, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password}),
        });
        const data = await res.json();
        if (data.success) {
            window.location.href = '/';
        } else {
            showError(data.message || '오류가 발생했습니다');
        }
    } catch (err) {
        showError('서버 연결 실패');
    } finally {
        btn.disabled = false;
        btn.textContent = mode === 'login' ? '로그인' : '회원가입';
    }
});

document.getElementById('username').focus();
</script>
</body>
</html>
